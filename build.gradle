import org.gradle.api.tasks.wrapper.Wrapper.DistributionType

buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

final String SUPPORT_LIBS_VERSION = '28.0.0-alpha1'

Properties localProps = new Properties()
File localPropsFile = project.rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}

// Version of the legacy fork. The version code continues above the last upstream
// Lawnchair 2 build (2589) so that it is always recognised as an update.
def legacyVersionCode = 3000
def legacyVersionName = "2.0-legacy-1"

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.protobuf'

android {
    namespace 'com.android.launcher3'
    compileSdk 35

    signingConfigs {
        legacy {
            def keystore = localProps.getProperty("storeFile") ?: System.getenv("LEGACY_STORE_FILE")
            if (keystore != null) {
                storeFile file(keystore)
                storePassword localProps.getProperty("storePass") ?: System.getenv("LEGACY_STORE_PASSWORD")
                keyAlias localProps.getProperty("keyAlias") ?: System.getenv("LEGACY_KEY_ALIAS") ?: "lawnchair-legacy"
                keyPassword localProps.getProperty("keyPass") ?: System.getenv("LEGACY_KEY_PASSWORD")
            }
        }
    }
    defaultConfig {
        minSdk 21
        targetSdk 35

        versionCode legacyVersionCode
        versionName legacyVersionName

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        buildConfigField "boolean", "FEATURE_QUINOA", "true"
        buildConfigField "boolean", "FEATURE_SETTINGS_SEARCH", "true"
        buildConfigField "boolean", "DEBUG_STRICT_MODE", "false"
        buildConfigField "boolean", "HAS_LEAKCANARY", "false"
        // Crash notifications with a "share" action, helps to find the remaining bugs
        buildConfigField "boolean", "FEATURE_BUG_REPORTER", "true"

        def githubToken = localProps.getProperty('githubToken') ?: '"' + (System.getenv("GITHUB_TOKEN") ?: "") + '"'
        buildConfigField "String", "GITHUB_TOKEN", githubToken

        buildConfigField "boolean", "SIGNATURE_VERIFICATION", "false"

        def debugMenuCode = System.getenv("DEBUG_MENU_CODE") ?: "veryperu"
        buildConfigField "String", "DEBUG_MENU_CODE_HASH", '"' + debugMenuCode.digest('SHA-1') + '"'

        def accuWeatherKey = localProps.getProperty('accu_key') ?: '"' + (System.getenv("ACCU_KEY") ?: "") + '"'
        buildConfigField "String", "ACCUWEATHER_KEY", accuWeatherKey

        buildConfigField "String", "BRIDGE_DOWNLOAD_URL", "\"https://lawnchair.app/lawnfeed/?ref=lawnchair\""

        ndk {
            abiFilters "armeabi-v7a", "x86", "x86_64", "arm64-v8a"
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard.flags'
            if (signingConfigs.legacy.storeFile != null) {
                signingConfig signingConfigs.legacy
            }
        }
    }

    buildFeatures {
        buildConfig true
        aidl true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    flavorDimensions = ["default", "custom", "build"]

    productFlavors {
        quickstep {
            dimension "default"
            applicationId 'ch.deletescape.lawnchair'
            testApplicationId 'com.android.launcher3.tests'
        }

        lawnchair {
            dimension "custom"
        }

        legacy {
            dimension "build"
            // Own package name so that it can be installed next to the original
            // Lawnchair 2 build (ch.deletescape.lawnchair.plah) and settings can be
            // migrated with the built-in backup function.
            applicationIdSuffix ".legacy"
        }
    }

    sourceSets {
        main {
            res.srcDirs = ['res']
            java.srcDirs = ['src', 'third_party/librootjava/java', 'third_party/recyclerviewmergeadapter/java']
            aidl.srcDirs = ['src', 'third_party/librootjava/aidl']
            assets.srcDirs = ['assets']
            manifest.srcFile 'AndroidManifest-common.xml'
            proto {
                srcDir 'protos/'
                srcDir 'proto_overrides/'
                srcDir 'proto_pixel/'
            }
        }

        debug {
            manifest.srcFile "AndroidManifest.xml"
        }

        release {
            manifest.srcFile "AndroidManifest.xml"
        }

        quickstep {
            res.srcDirs = ['quickstep/res']
            java.srcDirs = ['src_flags', 'quickstep/src']
            manifest.srcFile "quickstep/AndroidManifest.xml"
        }

        lawnchair {
            res.srcDirs = ['lawnchair/res']
            java.srcDirs = ['lawnchair/src']
            manifest.srcFile "lawnchair/AndroidManifest.xml"
        }
    }
}

// Hidden framework APIs (compiled against a stub of the Android 9 framework). The jar is put
// in front of android.jar so that javac resolves the hidden members.
def frameworkJar = file('lawnchair/libs/framework.jar')
tasks.withType(JavaCompile).configureEach {
    doFirst {
        options.bootstrapClasspath = files(frameworkJar) + (options.bootstrapClasspath ?: files())
    }
    options.compilerArgs += ['-Xlint:-deprecation', '-Xlint:-unchecked', '-Xmaxerrs', '10000']
}

android.applicationVariants.configureEach { variant ->
    variant.resValue 'string', 'application_id', variant.applicationId
}

apply from: 'lawnchair/smali.gradle'

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

dependencies {
    compileOnly files(frameworkJar)

    implementation "com.android.support:appcompat-v7:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:cardview-v7:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:design:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:support-v4:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:support-dynamic-animation:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:recyclerview-v7:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:palette-v7:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:preference-v7:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:preference-v14:${SUPPORT_LIBS_VERSION}"
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'

    implementation 'com.google.protobuf.nano:protobuf-javanano:3.0.0-alpha-7'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'com.github.KwabenBerko:OpenWeatherMap-Android-Library:2.0.1'
    implementation 'com.github.LawnchairLauncher:chroma:1.2.6'
    implementation 'com.github.LawnchairLauncher:hoko-lite:4e0d797'
    implementation('com.github.LawnchairLauncher:attribouter-y:0.1.6') {
        // The "MaterialButton" styleable defines an attr named iconSize which breaks compatibility with our source base
        exclude group: 'com.android.support', module: 'design'
        // Only available on JCenter, vendored in third_party/flexbox
        exclude group: 'com.google.android', module: 'flexbox'
    }
    implementation project(':third_party:flexbox')
    implementation project(':platformcompat')
    implementation 'com.github.bumptech.glide:glide:4.8.0'

    implementation('com.github.topjohnwu.libsu:core:2.5.0') {
        // Only annotations, not needed at runtime and would pull in AndroidX
        exclude group: 'androidx.annotation'
    }
    implementation 'com.luckycatlabs:SunriseSunsetCalculator:1.2'
    implementation 'com.squareup.retrofit2:retrofit:2.6.0'
    implementation 'com.squareup.okhttp3:okhttp:4.0.0-RC1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.0.0-RC1'
    implementation 'com.squareup.retrofit2:converter-gson:2.6.0'

    implementation 'me.xdrop:fuzzywuzzy:1.2.0'

    // Lifts the non-SDK interface restrictions that apply to apps targeting API > 28.
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    quickstepImplementation project(':systemui-shared')
    lawnchairImplementation files('lawnchair/libs/sesame-lib.aar')
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.0.0-alpha-3'
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                remove java
                javanano {
                    option "java_package=launcher_log_extension.proto|com.android.launcher3.userevent.nano"
                    option "java_package=launcher_log.proto|com.android.launcher3.userevent.nano"
                    option "java_package=launcher_dump.proto|com.android.launcher3.model.nano"
                    option "java_package=search.proto|com.google.android.apps.nexuslauncher.search.nano"
                    option "java_package=smartspace.proto|com.google.android.apps.nexuslauncher.smartspace.nano"
                    option "enum_style=java"
                }
            }
        }
    }
}
