apply plugin: 'com.android.library'

android {
    namespace 'com.android.systemui.shared'
    compileSdk 35

    defaultConfig {
        minSdk 21
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            aidl.srcDirs = ['src/main/java']
        }
    }
}

def frameworkJar = rootProject.file('lawnchair/libs/framework.jar')
tasks.withType(JavaCompile).configureEach {
    doFirst {
        options.bootstrapClasspath = files(frameworkJar) + (options.bootstrapClasspath ?: files())
    }
}

dependencies {
    compileOnly files(frameworkJar)
    implementation "com.android.support:support-annotations:28.0.0-alpha1"
}
