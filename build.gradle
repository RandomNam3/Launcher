import org.gradle.api.tasks.wrapper.Wrapper.DistributionType

buildscript {
    ext.kotlin_version = '2.4.21'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

final String SUPPORT_LIBS_VERSION = '28.0.0-alpha1'

Properties localProps = new Properties()
File localPropsFile = project.rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}

// Launcher is based on Lawnchair 2.0 build 2589, see README.md
// The release workflow sets the version from the git tag.
def appVersionCode = (System.getenv("LAUNCHER_VERSION_CODE") ?: "10101") as int
def appVersionName = System.getenv("LAUNCHER_VERSION_NAME") ?: "1.1.1"

// Signing: local.properties for local builds, environment variables (GitHub Actions secrets) on CI
def releaseKeystore = localProps.getProperty("storeFile") ?: System.getenv("LAUNCHER_STORE_FILE")
if (System.getenv("LAUNCHER_REQUIRE_SIGNING") == "true") {
    if (!releaseKeystore || !file(releaseKeystore).isFile()) {
        throw new GradleException("Release signing required, but no keystore found (LAUNCHER_STORE_FILE)")
    }
    ["LAUNCHER_STORE_PASSWORD", "LAUNCHER_KEY_PASSWORD"].each {
        if (!System.getenv(it)) throw new GradleException("Release signing required, but $it is not set")
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.android.launcher3'
    compileSdk 37

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword localProps.getProperty("storePass") ?: System.getenv("LAUNCHER_STORE_PASSWORD")
                keyAlias localProps.getProperty("keyAlias") ?: System.getenv("LAUNCHER_KEY_ALIAS") ?: "launcher"
                keyPassword localProps.getProperty("keyPass") ?: System.getenv("LAUNCHER_KEY_PASSWORD")
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    defaultConfig {
        minSdk 21
        targetSdk 37

        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        buildConfigField "boolean", "FEATURE_SETTINGS_SEARCH", "true"
        buildConfigField "boolean", "DEBUG_STRICT_MODE", "false"
        buildConfigField "boolean", "HAS_LEAKCANARY", "false"
        buildConfigField "boolean", "FEATURE_BUG_REPORTER", "false"

        def githubToken = localProps.getProperty('githubToken') ?: '"' + (System.getenv("GITHUB_TOKEN") ?: "") + '"'
        buildConfigField "String", "GITHUB_TOKEN", githubToken

        buildConfigField "boolean", "SIGNATURE_VERIFICATION", "false"

        def debugMenuCode = System.getenv("DEBUG_MENU_CODE") ?: "veryperu"
        buildConfigField "String", "DEBUG_MENU_CODE_HASH", '"' + debugMenuCode.digest('SHA-1') + '"'

        buildConfigField "String", "BRIDGE_DOWNLOAD_URL", "\"https://lawnchair.app/lawnfeed/?ref=lawnchair\""

        ndk {
            abiFilters "armeabi-v7a", "x86", "x86_64", "arm64-v8a"
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard.flags'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
        aidl true
        resValues true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    flavorDimensions = ["default", "custom"]

    productFlavors {
        quickstep {
            dimension "default"
            applicationId 'io.github.randomnam3.launcher'
            testApplicationId 'io.github.randomnam3.launcher.tests'
        }

        lawnchair {
            dimension "custom"
        }
    }

    sourceSets {
        main {
            res.srcDirs = ['res']
            java.srcDirs = ['src', 'src_generated', 'third_party/librootjava/java', 'third_party/recyclerviewmergeadapter/java']
            aidl.srcDirs = ['src', 'third_party/librootjava/aidl']
            assets.srcDirs = ['assets']
            manifest.srcFile 'AndroidManifest-common.xml'
        }

        debug {
            manifest.srcFile "AndroidManifest.xml"
        }

        release {
            manifest.srcFile "AndroidManifest.xml"
        }

        quickstep {
            res.srcDirs = ['quickstep/res']
            java.srcDirs = ['src_flags', 'quickstep/src']
            manifest.srcFile "quickstep/AndroidManifest.xml"
        }

        lawnchair {
            res.srcDirs = ['lawnchair/res']
            java.srcDirs = ['lawnchair/src']
            manifest.srcFile "lawnchair/AndroidManifest.xml"
        }
    }

    // Java and Kotlin sources share the same directories (built-in Kotlin of AGP 9 only looks at
    // the kotlin directories by default)
    sourceSets.configureEach { sourceSet ->
        sourceSet.kotlin.srcDirs(sourceSet.java.srcDirs)
    }
}

// Hidden framework APIs (compiled against a stub of the Android 9 framework). The jar is put
// in front of android.jar so that javac resolves the hidden members.
def frameworkJar = file('lawnchair/libs/framework.jar')
// Only the compilers may see the stub, never D8/R8: they would treat the android.* classes in it
// as app code and desugar default interface methods to non-existing companion classes
// (NoClassDefFoundError: android/content/ServiceConnection$-CC).
tasks.withType(JavaCompile).configureEach {
    doFirst {
        options.bootstrapClasspath = files(frameworkJar) + (options.bootstrapClasspath ?: files())
    }
    options.compilerArgs += ['-Xlint:-deprecation', '-Xlint:-unchecked', '-Xmaxerrs', '10000']
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    libraries.from(frameworkJar)
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.resValues.put(variant.makeResValueKey("string", "application_id"),
                new com.android.build.api.variant.ResValue(variant.applicationId.get(), null))
    }
}

apply from: 'lawnchair/smali.gradle'

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

dependencies {

    implementation "com.android.support:appcompat-v7:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:cardview-v7:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:design:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:support-v4:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:support-dynamic-animation:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:recyclerview-v7:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:palette-v7:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:preference-v7:${SUPPORT_LIBS_VERSION}"
    implementation "com.android.support:preference-v14:${SUPPORT_LIBS_VERSION}"
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    // Resolved to 28.0.0 through the chroma module before, keep that explicit (Consumer etc.)
    implementation "com.android.support:support-compat:28.0.0"

    implementation 'com.google.protobuf.nano:protobuf-javanano:3.0.0-alpha-7'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation project(':third_party:chroma')
    implementation project(':platformcompat')



    // Lifts the non-SDK interface restrictions that apply to apps targeting API > 28.
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.2'

    quickstepImplementation project(':systemui-shared')
}
