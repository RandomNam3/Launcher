import smali.SmaliTask

// The smali sources (prebuilt Pixel launcher prediction code) are assembled into a dex file,
// converted back to a jar and then compiled into the app like any other library. R8/D8 dexes it
// again together with the rest of the app.

def smaliInputDir = file('lawnchair/smali')
def dexFile = layout.buildDirectory.file("lawnchairsmali/lawnchair.dex").get().asFile
def jarFile = layout.buildDirectory.file("lawnchairlibs/lawnchair.jar").get().asFile
def errorFile = layout.buildDirectory.file("lawnchairlibs/lawnchair-error.zip").get().asFile

def smaliToDex = tasks.register('smaliToDexLawnchair', SmaliTask) {
    source = fileTree(dir: smaliInputDir, include: '**/*.smali')
    destination = dexFile
}

def dexToJar = tasks.register('dexToJarLawnchair', JavaExec) {
    dependsOn smaliToDex
    classpath = fileTree(dir: file('buildSrc/dex2jar'), include: '*.jar')
    mainClass = "com.googlecode.dex2jar.tools.Dex2jarCmd"
    args = [dexFile, "--output", jarFile, "--exception-file", errorFile, "--not-handle-exception", "--force"]
    inputs.file dexFile
    outputs.file jarFile
}

dependencies {
    lawnchairImplementation files(jarFile).builtBy(dexToJar)
}
