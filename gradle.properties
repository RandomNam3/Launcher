org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# The support library 28 contains libraries sharing a namespace (e.g. design-tabs and
# design-textfield), AGP 9 rejects that by default
android.uniquePackageNames=false
